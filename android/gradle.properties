org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Which bank the app talks to.
# useFakeApi=true starts the app fully offline on FakeOminiraApi. Settings > "Use the live Gateway"
# flips it on the phone, so one APK does both.
# gatewayUrl must end in /v1. Cloud Run, or http://<laptop IP>:8080/v1 on the same Wi-Fi (debug builds only).
ominira.useFakeApi=true
# Set ominira.gatewayUrl in your own ~/.gradle/gradle.properties, not here, so the live URL stays out of git.
ominira.gatewayToken=demo-customer

# Speak and listen through the Gateway (YarnGPT, all five languages). Only used with the live
# Gateway. The phone's own voice and recogniser take over whenever cloud speech fails.
ominira.cloudVoice=true

# ominira.mockAdminToken lets "Start again from welcome" reset the Gateway's mock bank.
# Put it in your own ~/.gradle/gradle.properties, never in this file, so it stays out of git.
