org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# true: offline on FakeOminiraApi. Settings > "Use the live Gateway" flips it.
ominira.useFakeApi=true
# ominira.gatewayUrl (ends in /v1) goes in ~/.gradle/gradle.properties, never here.
ominira.gatewayToken=demo-customer

# Speech through the Gateway (live Gateway only); the phone takes over on failure.
ominira.cloudVoice=true

# ominira.mockAdminToken also goes in ~/.gradle/gradle.properties, never here.
