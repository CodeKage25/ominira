name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK (talks to the live Gateway, falls back offline)
        env:
          OMINIRA_GATEWAY_URL: ${{ secrets.OMINIRA_GATEWAY_URL }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest -Pominira.gatewayUrl="$OMINIRA_GATEWAY_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: ominira-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
